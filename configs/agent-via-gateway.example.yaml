# Run cmd/ai-gateway on port 8090 first. "chat" is its configured model alias.
agent:
  max_steps: 8
  context_tokens: 24000
model:
  protocol: easygo
  endpoint: http://127.0.0.1:8090/v1/generate
  name: chat
  apikey: "{AI_GATEWAY_BEARER_TOKEN}"
  timeout: 120s
  # A custom JSON alias uses name: custom and streaming: false explicitly.
database:
  driver: memory
memory:
  enabled: false
http:
  address: 127.0.0.1:8080
workshop:
  enabled: false
  base_url: http://127.0.0.1:8091
  auth_token: "{WORKSHOP_BEARER_TOKEN}"
  request_timeout: 15s
