version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    # Unchecked Close, Flush, os.Remove(All), *print*, os.(Un)Setenv and os.Stdout/Stderr results.
    presets:
      - std-error-handling
    rules:
      # Cleanup in tests is not worth checking call by call.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  # Report every finding instead of the default 50 per linter / 3 identical.
  max-issues-per-linter: 0
  max-same-issues: 0
