agent:
  max_steps: 8
  context_tokens: 24000

database:
  driver: postgres # memory 可用于无数据库的开发模式
  dsn: "{DATABASE_URL}"
  max_conns: 16

http:
  address: "127.0.0.1:8080"

model:
  name: deepseek-v4-pro
  base_url: "https://api.deepseek.com"
  timeout: 120s
  apikey: "{MODEL_API_KEY}"
subagent:
  name: deepseek-v4-flash
  base_url: "https://api.deepseek.com"
  timeout: 120s
  apikey: "{SUBMODEL_API_KEY}"
