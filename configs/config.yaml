agent:
  max_steps: 8
  context_tokens: 24000

database:
  driver: postgres # memory 可用于无数据库的开发模式
  dsn: "{DATABASE_URL}"
  max_conns: 16

# Dedicated database for user-level long-term memory. It is deliberately not
# the conversation database; grant this DSN only to the memory runtime.
memory:
  enabled: true
  dsn: "{MEMORY_DATABASE_URL}"
  max_conns: 4
  daily_at: "03:00"
  timezone: "Asia/Shanghai"
  batch_turns: 20
  top_k: 5
  storage_root: "storage/longterm"

http:
  address: "127.0.0.1:8080"

queue:
  max_pending: 100
  max_workers: 4
  poll_interval: 250ms
  lease_ttl: 30s

sandbox:
  enabled: false
  base_url: "http://127.0.0.1:8787"
  auth_token: "{SANDBOX_CONTROLLER_TOKEN}"
  request_timeout: 11m
  max_output_bytes: 65536

model:
  name: deepseek-flash
  base_url: "https://api.deepseek.com"
  timeout: 120s
  apikey: "{MODEL_API_KEY}"
subagent:
  name: deepseek-flash
  base_url: "https://api.deepseek.com"
  timeout: 120s
  apikey: "{SUBMODEL_API_KEY}"
