name: easygo-sandbox-integration

services:
  # Build-only target. The profile prevents Compose from running an idle
  # runtime; the controller creates every test runtime through Engine API.
  sandbox-runtime:
    profiles: ["sandbox-image"]
    image: easygo-agent-sandbox-runtime:local
    build:
      context: .
      dockerfile: deploy/sandbox/runtime.Dockerfile
    entrypoint: ["/bin/true"]
    network_mode: none
    restart: "no"

  sandbox-controller:
    image: easygo-agent-sandbox-controller:local
    build:
      context: .
      dockerfile: deploy/sandbox/controller.Dockerfile
    command: ["-config", "/etc/easygo/sandbox-controller.yaml"]
    environment:
      SANDBOX_CONTROLLER_TOKEN: "${SANDBOX_CONTROLLER_TOKEN:?SANDBOX_CONTROLLER_TOKEN is required}"
    ports:
      - "127.0.0.1:${SANDBOX_TEST_PORT:-18787}:8787"
    volumes:
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - ./configs/sandbox-controller.integration.yaml:/etc/easygo/sandbox-controller.yaml:ro
      - sandbox-controller-test-data:/var/lib/easygo-sandbox
    restart: "no"
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid,nodev,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/sandbox-controller", "-healthcheck", "http://127.0.0.1:8787/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  sandbox-controller-test-data:
