services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: easygo
      POSTGRES_USER: easygo
      POSTGRES_PASSWORD: easygo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./compose/init-memory-db.sql:/docker-entrypoint-initdb.d/10-memory-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easygo -d easygo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
